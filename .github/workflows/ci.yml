name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: the descriptors are the ones gen.mjs writes
        run: npm run gen && git diff --exit-code descriptors
      - run: npm test
      - name: the cases are the ones the tests write
        run: git diff --exit-code cases
      - run: node survey/wrong-version.mjs
